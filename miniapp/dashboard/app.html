<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>SELF RIVAL</title>

<style>
@font-face{font-family:'Lalezar';font-display:swap;src:local('Lalezar'),local('Lalezar-Regular'),url('__API__/fonts/Lalezar-Regular.ttf') format('truetype'),url('https://cdn.jsdelivr.net/npm/@fontsource/lalezar/files/lalezar-arabic-400-normal.woff2') format('woff2')}
@font-face{font-family:'Vazirmatn';font-weight:400;font-display:swap;src:local('Vazirmatn'),local('Vazirmatn Regular'),url('__API__/fonts/Vazirmatn-Regular.ttf') format('truetype'),url('https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2')}
@font-face{font-family:'Vazirmatn';font-weight:700;font-display:swap;src:local('Vazirmatn Bold'),local('Vazirmatn-Bold'),url('__API__/fonts/Vazirmatn-Bold.ttf') format('truetype'),url('https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2')}
:root{--bg:#02050f;--tx:#eaf1ff;--hint:#8fa6d4;--ac:#4d9bff;--ac2:#b9c8e6;--ok:#58d6a0;--bad:#ff7f8f;--warn:#f2c46b;
 --line:rgba(140,185,255,.22);--glass:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
 --fd:'Lalezar','Vazirmatn',system-ui,sans-serif;--ft:'Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;
 --grad:linear-gradient(135deg,#e6eeff 0%,#7db4ff 38%,#2f6fff 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ft);font-size:14px;line-height:1.6}
body{min-height:100vh;background:
 radial-gradient(70% 36% at 12% -6%,#2f6fff40 0%,transparent 70%),
 radial-gradient(60% 32% at 100% 8%,#7db4ff26 0%,transparent 72%),
 radial-gradient(80% 40% at 0% 108%,#0a3fb83d 0%,transparent 70%),var(--bg);background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:12px 12px 108px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(18px) saturate(150%);
 backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 14px 34px -20px #000}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;letter-spacing:.2px}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px}
.av{width:48px;height:48px;border-radius:50%;background:#0b1a40 center/cover;border:2px solid var(--ac);flex:none;display:grid;place-items:center;font-family:var(--fd);font-size:20px}
.who{flex:1;min-width:0}.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--hint);font-size:12px;direction:ltr;unicode-bidi:plaintext}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:rgba(77,155,255,.14);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#56627f;box-shadow:0 0 0 3px rgba(86,98,127,.25)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(88,214,160,.25),0 0 12px var(--ok)}
.hero{position:relative;overflow:hidden;min-height:250px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;
 background:linear-gradient(180deg,rgba(2,5,15,.05) 0%,rgba(2,5,15,.88) 78%),url('__API__/assets/banner.jpg') center/cover}
.hero h2{font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 14px;color:#c9d7f3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 18px;font:700 14px var(--ft);color:#03102b;
 background:var(--grad);cursor:pointer;box-shadow:0 10px 26px -12px #4d9bffaa;text-decoration:none}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.bad{background:rgba(255,127,143,.14);color:var(--bad);border:1px solid rgba(255,127,143,.35);box-shadow:none}
.btn.full{width:100%}.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{padding:12px 8px;text-align:center}.stat b{display:block;font-family:var(--fd);font-size:24px;font-weight:400}
.stat span{color:var(--hint);font-size:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 10px}.sec h3{font-size:20px}.sec span{color:var(--hint);font-size:12px}
.cat{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:right;color:inherit;font:inherit}
.cat .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;
 background:linear-gradient(135deg,rgba(77,155,255,.35),rgba(77,155,255,.08));border:1px solid var(--line)}
.cat .tx{flex:1;min-width:0}.cat b{font-family:var(--fd);font-weight:400;font-size:19px;display:block}.cat small{color:var(--hint)}
.cat .cnt{font-size:12px;color:var(--ac)}.cat .chev{opacity:.6;transition:transform .2s}.cat.open .chev{transform:rotate(90deg)}
.panel{display:none;margin:-4px 0 12px;padding:12px}.panel.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;padding:12px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:inherit;font:inherit;text-align:right;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{font-size:22px}.tile .nm{font-weight:700;margin-top:6px}
.tile .st{align-self:flex-start;font-size:11px;padding:2px 9px;border-radius:99px;background:rgba(143,166,212,.15);color:var(--hint)}
.tile.on{border-color:rgba(88,214,160,.55);background:linear-gradient(160deg,rgba(88,214,160,.17),rgba(88,214,160,.03))}
.tile.on .st{background:rgba(88,214,160,.2);color:var(--ok)}
.tile.cyc .st{background:rgba(77,155,255,.18);color:var(--ac)}
.tile:active{transform:scale(.97)}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.seg button{flex:1;padding:8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font:inherit;cursor:pointer}
.seg button.on{background:var(--grad);color:#03102b;border-color:transparent;font-weight:700}
.note{padding:12px 14px;margin-bottom:12px;color:var(--warn);border-color:rgba(242,196,107,.35)}
.big{padding:20px;text-align:center}.big .n{font-family:var(--fd);font-size:46px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .sub{color:var(--hint)}
.list{padding:6px 12px}.li{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(140,185,255,.12)}.li:last-child{border:0}
.li b{font-weight:700}.pos{color:var(--ok)}.neg{color:var(--bad)}
.kv{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid rgba(140,185,255,.12)}.kv:last-child{border:0}.kv span{color:var(--hint)}
.code{direction:ltr;text-align:left;background:rgba(0,0,0,.35);border:1px dashed var(--line);border-radius:14px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(536px,calc(100% - 24px));display:flex;padding:6px;border-radius:26px;
 background:rgba(8,18,46,.62);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);z-index:9}
.nav button{flex:1;border:0;background:none;color:var(--hint);padding:8px 2px;border-radius:20px;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:20px}.nav button.on{color:var(--tx);background:rgba(77,155,255,.22);box-shadow:inset 0 0 0 1px var(--line)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);padding:10px 18px;border-radius:16px;background:rgba(8,18,46,.92);border:1px solid var(--line);transition:transform .25s;z-index:20;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.ic{width:1em;height:1em;stroke:url(#ig);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 0 6px rgba(77,155,255,.55))}
.badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:15px;font-size:24px;flex:none;
 background:radial-gradient(120% 120% at 20% 10%,rgba(125,180,255,.38),rgba(47,111,255,.08) 70%);border:1px solid var(--line);animation:fl 4s ease-in-out infinite}
.badge.lg{width:54px;height:54px;font-size:28px;border-radius:18px}.badge.red{background:radial-gradient(120% 120% at 20% 10%,rgba(255,127,143,.4),rgba(255,127,143,.05) 70%);border-color:rgba(255,127,143,.4)}
.tile .badge{width:38px;height:38px;font-size:21px;border-radius:13px;animation:none}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.nav button .ic{font-size:22px}
#boot{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
 background:radial-gradient(60% 40% at 50% 38%,#16358f66 0%,transparent 70%),#02050f;transition:opacity .5s,visibility .5s}
#boot.hide{opacity:0;visibility:hidden}
#boot .mark{position:relative;width:128px;height:128px;display:grid;place-items:center}
#boot .ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#7db4ff;border-right-color:#2f6fff55;animation:sp 1.3s linear infinite;filter:drop-shadow(0 0 10px #4d9bff)}
#boot .ring.r2{inset:12px;animation-duration:2s;animation-direction:reverse;border-top-color:#b9c8e6}
#boot svg{width:68px;height:68px;stroke:url(#ig);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 14px #4d9bff);animation:pl 2s ease-in-out infinite}
#boot h1{font-family:var(--fd);font-size:34px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
#boot .bar{width:170px;height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--grad);border-radius:9px;animation:ld 1.2s ease-in-out infinite}
#boot small{color:var(--hint)}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes ld{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.lock{padding:22px;text-align:center;border-color:rgba(255,127,143,.35)}.lock h3{color:var(--bad);margin:8px 0}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.step button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:700 18px var(--ft);cursor:pointer}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mini button{padding:6px 11px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:12px;cursor:pointer}
.mini button.on{background:var(--grad);color:#03102b;border-color:transparent;font-weight:700}
.tg{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(140,185,255,.12)}.tg:last-child{border:0}
.skel{height:90px;margin-bottom:10px;border-radius:22px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>

<nav class="nav" id="nav"></nav>
<div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp,API='__API__',BOT='__BOT__';
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#02050f');tg.setBackgroundColor('#02050f')}catch(e){}}
const $=s=>document.querySelector(s),fa=n=>Number(n||0).toLocaleString('en-US');
const ico=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const badge=(n,c)=>`<span class="badge ${c||''}">${ico(n)}</span>`;
const IC={clock:'clock',font:'type',bio_clock:'clock',bio_date:'cal',bio_date_type:'cal',bio_font:'palette',avatar:'image',panel_color:'palette',help_color:'palette',
 bold:'type',spoiler:'eye',code:'type',underline:'type',gradual:'pen',pemoji:'star',dot_commands:'bolt',
 anti_delete:'trash',anti_edit:'pen',tag_alert:'bell',filter_words_active:'shield',secretary:'chat',self_destruct:'trash',first_comment:'star',auto_seen:'eye',auto_save:'bookmark',forced_join_active:'link',
 pv_lock:'lock',pv_photo:'image',pv_video:'play',pv_gif:'play',pv_voice:'mic',pv_music:'music',pv_sticker:'star',pv_loc:'pin',pv_emo:'star',pv_txt:'type',
 typing:'kbd',playing:'pad',upload_photo:'image',record_voice:'mic',watch_gif:'play',
 tabchi_pv:'user',tabchi_gp:'users',tabchi_smart:'cpu',tabchi_speed:'bolt',enemy_active:'target',friend_active:'users',crash_active:'star',
 ai_stream:'bolt',ai_search:'search',ai_footer:'bookmark',ai_auto:'cpu',ai_label:'bookmark',ai_notify:'bell',ai_persona:'user'};
const CIC={prof:'user',text:'chat',smart:'cpu',shield:'shield',pres:'radar',tab:'mega',target:'target',ai:'cpu',lang:'globe'};
async function call(ep,body){try{const r=await fetch(API+'/miniapp/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify(Object.assign({initData:tg?tg.initData:''},body||{}))});return await r.json()}catch(e){return{ok:false,err:'اتصال برقرار نشد'}}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
const hap=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch(e){}};
const openTg=u=>{try{tg.openTelegramLink(u)}catch(e){location.href=u}};

/* ----- feature map: [key,label,icon,type] ----- */
const CATS=[
{id:'prof',ic:'👤',t:'پروفایل و ظاهر',d:'ساعت، نام، بیو و آواتار',it:[['clock','ساعت پروفایل','🕒'],['font','استایل نام','🔠','c'],['bio_clock','ساعت بیو','🕰'],['bio_date','تاریخ بیو','📅'],['bio_date_type','نوع تقویم','🗓','c'],['bio_font','استایل بیو','🎨','c'],['avatar','آواتار زنده','🖼'],['panel_color','پنل رنگی','🌈'],['help_color','راهنمای رنگی','🌈']]},
{id:'text',ic:'✍️',t:'متن و پیام',d:'قالب‌بندی پیام‌های خروجی',it:[['bold','بولد','🅱️'],['spoiler','اسپویلر','🫥'],['code','نقل و قول','💬'],['underline','زیرخط','➖'],['gradual','تدریجی','⏳'],['pemoji','ایموجی پریمیوم','⭐'],['dot_commands','دستور با نقطه','🔹']]},
{id:'smart',ic:'🧠',t:'هوشمند و خودکار',d:'منشی، ضد حذف، کامنت اول و …',it:[['anti_delete','ضد دیلیت','🗑'],['anti_edit','ضد ادیت','✏️'],['tag_alert','هشدار تگ','🔔'],['filter_words_active','فیلتر کلمات','🚫'],['secretary','منشی خودکار','🗂'],['self_destruct','پیام پاک‌شونده','💨'],['first_comment','کامنت اول','🥇'],['auto_seen','سین خودکار','👁'],['auto_save','ذخیره تایم‌دار','⏱'],['forced_join_active','عضویت اجباری','🔗']]},
{id:'shield',ic:'🛡',t:'سپر پیوی',d:'قفل و فیلتر رسانه‌ی پیوی',it:[['pv_lock','قفل کامل پیوی','🔒'],['pv_photo','عکس','📷'],['pv_video','ویدیو','🎬'],['pv_gif','گیف','🎞'],['pv_voice','ویس','🎙'],['pv_music','آهنگ','🎵'],['pv_sticker','استیکر','🏷'],['pv_loc','لوکیشن','📍'],['pv_emo','ایموجی','😀'],['pv_txt','متن','📝']]},
{id:'pres',ic:'📡',t:'حضور و فعالیت',d:'وضعیت نمایشی هنگام آنلاین بودن',it:[['typing','تایپینگ','⌨️'],['playing','در حال بازی','🎮'],['upload_photo','ارسال عکس','📤'],['record_voice','ضبط ویس','🔴'],['watch_gif','تماشای گیف','📺']]},
{id:'tab',ic:'📣',t:'تبچی و تبلیغات',d:'ارسال خودکار بنر',it:[['tabchi_pv','پیوی','👤'],['tabchi_gp','گروه','👥'],['tabchi_smart','هوشمند','🧠'],['tabchi_speed','سرعت','⚡','c']]},
{id:'target',ic:'🎯',t:'لیست‌های هدف',d:'پاسخ خودکار به دشمن، دوست و کراش',it:[['enemy_active','دشمن','⚔️'],['friend_active','دوست','🤝'],['crash_active','کراش','💘']]},
{id:'ai',ic:'🤖',t:'هوش مصنوعی',d:'تنظیمات دستیار هوشمند',it:[['ai_stream','نمایش زنده','⚡'],['ai_search','جستجو','🔍'],['ai_footer','پانوشت','🏷'],['ai_auto','پاسخ خودکار','🤖'],['ai_label','برچسب','🔖'],['ai_notify','اعلان','🔔'],['ai_persona','شخصیت','🎭','c']]},
{id:'lang',ic:'🌐',t:'ترجمه‌ی خودکار',d:'زبان مقصد پیام‌های خروجی',it:[],lang:true}];
const TR=[['en','English'],['ru','Русский'],['zh-CN','中文'],['off','خاموش']];

const NI={dash:ico('home'),feat:ico('sliders'),pew:ico('target'),gems:ico('gem'),acct:ico('user')};
const NL=[['dash','داشبورد'],['feat','قابلیت‌ها'],['pew','پیو پیو'],['gems','الماس'],['acct','حساب']];
function navHtml(){return NL.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${NI[k]}${l}</button>`).join('')}
let S=null,E=null,P=null,tab='dash',openCat=null;
const settings=()=>(S&&S.settings)||{};
const isOn=k=>settings()[k]===true;
function catStats(c){const its=c.it.filter(i=>!(i[0].startsWith('ai_')&&!(i[0] in settings())));return{n:its.length,on:its.filter(i=>i[3]!=='c'&&isOn(i[0])).length,its}}
function modulesOn(){return CATS.reduce((a,c)=>a+catStats(c).on,0)}

function header(){
 const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
 $('#nm').textContent=[u.first_name,u.last_name].filter(Boolean).join(' ')||'کاربر ریوال';
 $('#un').textContent=u.username?'@'+u.username:'';
 const av=$('#av');if(u.photo_url){av.style.backgroundImage='url('+u.photo_url+')';av.textContent=''}else av.textContent=(u.first_name||'R')[0];
 $('#gem').textContent='💎 '+(E?fa(E.balance):'…');
 $('#dot').className='dot'+(S&&S.running?' on':'');
}

function viewDash(){
 const on=S&&S.running,days=E?(E.days>=9999?'∞':fa(E.days)):'—';
 let h=`<div class="card hero"><h2>SELF RIVAL</h2><p>${on?'سلف روشن است و دستورهایت اجرا می‌شوند.':'سلف روی اکانتت فعال نیست؛ با یک ورود امن شروع کن.'}</p>
 <div class="row">${on?`<button class="btn" data-go="feat">🎛 مدیریت قابلیت‌ها</button>`:`<button class="btn" data-open="https://t.me/${BOT}?start=">⚡ فعال‌سازی سلف</button>`}
 <button class="btn ghost" data-go="gems">💎 الماس</button></div></div>
 <div class="stats"><div class="card stat"><b>${fa(modulesOn())}</b><span>ماژول روشن</span></div>
 <div class="card stat"><b>${days}</b><span>روز اشتراک</span></div><div class="card stat"><b>${E&&E.rank?'#'+fa(E.rank):'—'}</b><span>رتبه</span></div></div>
 <div class="sec"><h3>دسته‌بندی‌ها</h3><span>برای ورود بزن</span></div>`;
 for(const c of CATS){const st=catStats(c);if(c.id==='ai'&&!st.n)continue;
  h+=`<button class="card cat" data-cat="${c.id}">${badge(CIC[c.id]||'sliders','lg')}<span class="tx"><b>${c.t}</b><small>${c.d}</small></span>
  <span class="cnt">${c.lang?(settings().translate?'روشن':'خاموش'):fa(st.on)+' / '+fa(st.n)}</span><span class="chev">‹</span></button>`}
 return h}

function tileHtml(i){const [k,l,ic,ty]=i,v=settings()[k];
 if(ty==='c')return `<button class="tile cyc" data-k="${k}"><span>${badge(IC[k]||'sliders')}<div class="nm">${l}</div></span><span class="st">${v==null?'—':String(v)}</span></button>`;
 return `<button class="tile ${v===true?'on':''}" data-k="${k}"><span>${badge(IC[k]||'sliders')}<div class="nm">${l}</div></span><span class="st">${v===true?'روشن':'خاموش'}</span></button>`}

function viewFeat(){
 let h='';
 if(S&&!S.running)h+=`<div class="card note">⚠️ سلف روشن نیست؛ برای تغییر قابلیت‌ها اول آن را فعال کن.</div>`;
 for(const c of CATS){const st=catStats(c);if(c.id==='ai'&&!st.n)continue;const o=openCat===c.id;
  h+=`<button class="card cat ${o?'open':''}" data-cat="${c.id}">${badge(CIC[c.id]||'sliders','lg')}<span class="tx"><b>${c.t}</b><small>${c.d}</small></span>
  <span class="cnt">${c.lang?'':fa(st.on)+' / '+fa(st.n)}</span><span class="chev">‹</span></button>
  <div class="card panel ${o?'show':''}">`;
  if(c.lang){const cur=settings().translate||'off';h+=`<div class="seg">${TR.map(([v,l])=>`<button data-tr="${v}" class="${(cur===v)?'on':''}">${l}</button>`).join('')}</div>`}
  else h+=`<div class="grid">${st.its.map(tileHtml).join('')}</div>`;
  h+=`</div>`}
 return h}

function viewGems(){
 if(!E)return '<div class="skel"></div>';
 let h=`<div class="card big"><div class="sub">موجودی شما</div><div class="n">${fa(E.balance)} 💎</div><div class="sub">معادل ${fa(E.toman)} تومان</div></div>
 <div class="stats"><div class="card stat"><b>${E.restricted?'⛔':(E.days>=9999?'∞':fa(E.days))}</b><span>${E.restricted?'محدود':'روز اشتراک'}</span></div>
 <div class="card stat"><b>${E.rank?'#'+fa(E.rank):'—'}</b><span>رتبه</span></div><div class="card stat"><b>${fa(E.month_cost)}</b><span>الماس / ماه</span></div></div>
 <div class="row" style="margin-bottom:10px"><button class="btn" data-buy="1">🔁 تمدید ۳۰ روزه</button><button class="btn ghost" data-open="https://t.me/${E.bot||BOT}">🛒 خرید الماس</button></div>
 <div class="row"><button class="btn ghost" data-open="${E.gift}">🎁 کد هدیه</button><button class="btn ghost" data-share="1">📤 دعوت دوستان</button></div>
 <div class="sec"><h3>لینک دعوت</h3><span>۲۰۰ الماس برای هر دعوت</span></div><div class="code" data-copy="${E.ref}">${E.ref}</div>`;
 if((E.history||[]).length){h+=`<div class="sec"><h3>آخرین تراکنش‌ها</h3></div><div class="card list">${E.history.map(x=>`<div class="li"><span>${x.t}</span><b class="${x.d>0?'pos':'neg'}">${x.d>0?'+':'−'}${fa(Math.abs(x.d))}</b></div>`).join('')}</div>`}
 h+=`<div class="sec"><h3>برترین‌ها</h3><span>۱۰ نفر اول</span></div><div class="card list">${(E.top||[]).map((t,i)=>`<div class="li"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'}  ${t.name}</span><b>${fa(t.balance)} 💎</b></div>`).join('')||'<div class="li"><span>هنوز کسی نیست</span></div>'}</div>`;
 return h}

const HUNT_PRE=[[180,300,'۳–۵ دقیقه'],[300,420,'۵–۷ دقیقه'],[420,600,'۷–۱۰ دقیقه']];
const FEED_PRE=[[1500,1800,'۲۵–۳۰ دقیقه'],[1800,2100,'۳۰–۳۵ دقیقه'],[2400,2700,'۴۰–۴۵ دقیقه']];
const WAIT_PRE=[[0,'خودکار'],[300,'۵ دقیقه'],[600,'۱۰ دقیقه'],[900,'۱۵ دقیقه'],[1800,'۳۰ دقیقه']];
const STN={active:'🟢 فعال',off:'⚫ خاموش',done:'✅ تمام',dead:'☠️'};
function pewToggle(c,key,label,icon,on){return `<div class="tg"><span>${badge(icon)} ${label}</span><button class="btn ghost" data-pew="toggle" data-cid="${c.id}" data-key="${key}">${on?'🟢 روشن':'⚫ خاموش'}</button></div>`}
function pewChat(c){
 const k=c.kill;
 let h=`<div class="sec"><h3>${c.title}</h3><span>${c.targets.length} هدف</span></div><div class="card" style="padding:12px">`;
 h+=pewToggle(c,'hunt','شکار خودکار','target',c.hunt.on)+`<div class="mini">${HUNT_PRE.map(([lo,hi,l])=>`<button class="${c.hunt.lo==lo&&c.hunt.hi==hi?'on':''}" data-pew="span" data-cid="${c.id}" data-feat="hunt" data-lo="${lo}" data-hi="${hi}">${l}</button>`).join('')}</div>`;
 h+=pewToggle(c,'feed','فید (🥩)','star',c.feed.on)+`<div class="mini">${FEED_PRE.map(([lo,hi,l])=>`<button class="${c.feed.lo==lo&&c.feed.hi==hi?'on':''}" data-pew="span" data-cid="${c.id}" data-feat="feed" data-lo="${lo}" data-hi="${hi}">${l}</button>`).join('')}</div>`;
 h+=pewToggle(c,'art','برداشت آرت','gift',c.art.on)+pewToggle(c,'kill','کیل خودکار','crown',k.on)+pewToggle(c,'del_shot','حذف پیام شلیک','trash',k.del_shot)+pewToggle(c,'del_bot','حذف پاسخ ربات','trash',k.del_bot);
 h+=`<div class="step"><span>تعداد کیل برای هر هدف</span><span class="row" style="flex:none;align-items:center"><button data-pew="rounds" data-cid="${c.id}" data-n="${Math.max(0,k.rounds-1)}">−</button><b style="min-width:34px;text-align:center">${k.rounds||'∞'}</b><button data-pew="rounds" data-cid="${c.id}" data-n="${k.rounds+1}">+</button></span></div>`;
 h+=`<div class="mini">${WAIT_PRE.map(([n,l])=>`<button class="${k.wait==n?'on':''}" data-pew="wait" data-cid="${c.id}" data-n="${n}">انتظار ${l}</button>`).join('')}</div></div>`;
 if(c.targets.length)h+=`<div class="card list" style="margin-top:8px">${c.targets.map(t=>`<div class="li"><span>${t.name} · ${STN[t.state]||t.state} · کیل ${t.kills}</span><span><button class="btn ghost" style="padding:4px 10px" data-pew="target_reset" data-cid="${c.id}" data-tid="${t.id}">♻️</button> <button class="btn bad" style="padding:4px 10px" data-pew="target_remove" data-cid="${c.id}" data-tid="${t.id}">🗑</button></span></div>`).join('')}</div>`;
 return h}
function viewPew(){
 if(!P)return '<div class="skel"></div><div class="skel"></div>';
 if(!P.allowed)return `<div class="card lock">${badge('lock','red lg')}<h3>پیو پیو ویژه‌ی کاربران پرو است</h3><p style="color:var(--hint)">باید از طریق ادمین اشتراک پرو فعال کنی.</p><button class="btn bad full" data-open="https://t.me/sadzr">درخواست اشتراک پرو</button></div>`;
 let h=`<div class="row" style="margin-bottom:10px"><button class="btn ${P.stop?'':'bad'}" data-pew="${P.stop?'resume':'stop'}">${P.stop?'▶️ ادامه':'🛑 توقف اضطراری'}</button><div class="card stat" style="flex:1"><b>${P.cooldown}s</b><span>کول‌داون مشترک</span></div></div>`;
 if(P.stop)h+=`<div class="card note">⛔ پیو پیو متوقف است.</div>`;
 if(!P.chats.length)h+=`<div class="card note">هنوز گپی تنظیم نشده؛ داخل گروه بنویس: <b dir="ltr">.پیو شکار روشن</b> و روی هدف ریپلای کن: <b dir="ltr">.شلیک</b></div>`;
 return h+P.chats.map(pewChat).join('')}
async function loadPew(){const r=await call('pew');if(r&&r.allowed!==undefined){P=r;if(tab==='pew')render()}}
let A=null;
function viewAcct(){
 const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
 let h=`<div class="card list"><div class="kv"><span>شناسه</span><b>${S?S.uid:'—'}</b></div><div class="kv"><span>شماره</span><b>${(S&&S.phone)||'—'}</b></div>
 <div class="kv"><span>وضعیت سلف</span><b>${S&&S.running?'🟢 روشن':(S&&S.has?'🟡 متوقف':'🔴 فعال نشده')}</b></div>
 <div class="kv"><span>اشتراک</span><b>${E?(E.days>=9999?'نامحدود':fa(E.days)+' روز'):'—'}</b></div></div>
 <div class="row" style="margin-top:12px"><button class="btn ghost" data-open="https://t.me/${BOT}">🤖 باز کردن ربات</button><button class="btn ghost" data-open="https://t.me/sadzr">💬 پشتیبانی</button></div>`;
 if(S&&S.admin){h+=`<div class="sec"><h3>مدیریت</h3><span>فقط ادمین</span></div><div class="card list">`;
  if(A){h+=`<div class="kv"><span>کاربران</span><b>${fa(A.total)}</b></div><div class="kv"><span>سلف روشن</span><b>${fa(A.running)}</b></div>
  <div class="kv"><span>ظرفیت</span><b>${fa(A.used)} / ${fa(A.limit)}</b></div>`}else h+=`<div class="kv"><span>در حال دریافت…</span></div>`;
  h+=`</div><div class="row" style="margin-top:10px"><button class="btn ghost" data-adm="g_fjoin">🔗 عضویت اجباری: ${A&&A.fjoin_on?'روشن':'خاموش'}</button>
  <button class="btn ${A&&A.global_on===false?'bad':'ghost'}" data-adm="g_bot">⚡ سلف‌ها: ${A&&A.global_on===false?'خاموش':'روشن'}</button></div>`}
 return h}

function render(){
 header();
 $('#view').innerHTML={dash:viewDash,feat:viewFeat,pew:viewPew,gems:viewGems,acct:viewAcct}[tab]();
 $('#nav').innerHTML=navHtml()}
function go(t){tab=t;render();window.scrollTo({top:0});if(t==='acct'&&S&&S.admin)loadAdmin();if(t==='pew')loadPew()}
async function loadAdmin(){const r=await call('admin',{op:'stats'});if(r.ok){A=r;if(tab==='acct')render()}}
async function refresh(){const [s,e]=await Promise.all([call('state'),call('eco')]);if(s.ok)S=s;if(e.ok||e.balance!=null)E=e;render()}
const T0=Date.now();

document.addEventListener('click',async ev=>{
 const pw=ev.target.closest&&ev.target.closest('[data-pew]');
 if(pw){hap();const d=pw.dataset,body={op:d.pew};['cid','key','feat','tid'].forEach(k=>{if(d[k]!==undefined)body[k]=d[k]});['lo','hi','n'].forEach(k=>{if(d[k]!==undefined)body[k]=Number(d[k])});
  const r=await call('pew',body);if(r.locked||r.allowed!==undefined)P=r;if(!r.ok)toast(r.err||'انجام نشد');return render()}
 const t=ev.target.closest('[data-go],[data-cat],[data-k],[data-tr],[data-buy],[data-open],[data-share],[data-copy],[data-adm],[data-pew]');if(!t)return;hap();
 if(t.dataset.go)return go(t.dataset.go);
 if(t.dataset.cat){const id=t.dataset.cat;openCat=(tab==='feat'&&openCat===id)?null:id;tab='feat';render();
   if(openCat){const el=document.querySelector('.cat.open');el&&el.scrollIntoView({behavior:'smooth',block:'start'})}return}
 if(t.dataset.open)return openTg(t.dataset.open);
 if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);toast('کپی شد ✅')}catch(e){toast('لینک را نگه دار و کپی کن')}return}
 if(t.dataset.share)return openTg('https://t.me/share/url?url='+encodeURIComponent(E.ref)+'&text='+encodeURIComponent('سلف ریوال؛ دستیار هوشمند تلگرام با الماس رایگان'));
 if(t.dataset.buy){const r=await call('eco',{op:'buy'});E=r;if(r.ok){toast('✅ اشتراک تمدید شد');const s=await call('state');if(s.ok)S=s}else toast(r.err||'انجام نشد');return render()}
 if(t.dataset.adm){const r=await call('admin',{op:t.dataset.adm});if(r.ok){A=r;render()}else toast(r.err||'انجام نشد');return}
 if(t.dataset.tr){const r=await call('set',{key:'translate',val:t.dataset.tr});if(r.settings)S.settings=r.settings;if(!r.ok)toast(r.err||'انجام نشد');return render()}
 if(t.dataset.k){if(!S||!S.running)return toast('سلف روشن نیست.');
  const r=await call('set',{key:t.dataset.k});if(r.settings)S.settings=r.settings;if(!r.ok)toast(r.err||'انجام نشد');render()}
});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){hap();go(b.dataset.t)}});
refresh().finally(()=>setTimeout(()=>$('#boot').classList.add('hide'),Math.max(0,1300-(Date.now()-T0))));
</script>
